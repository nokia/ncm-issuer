version: 2
updates:
  # Go dependencies in the root go.mod. One group per run keeps the Kubernetes, controller-runtime
  # and cert-manager libraries in a single pull request, since they only build against a matching
  # k8s.io minor version and have to move together.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns: ["*"]
    commit-message:
      prefix: "build"

  # GitHub Actions used in .github/workflows/*.yml (auto-discovered)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Base images in the controller Dockerfile at repo root
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    ignore:
      # Keep the builder on the Go 1.26 line so it matches the go directive in go.mod and
      # the Go version the pinned golangci-lint was built against. Patch releases within
      # 1.26 still come through, which is where the toolchain security fixes land. Raise
      # this bound deliberately when moving to a newer Go line, together with go.mod.
      - dependency-name: "golang"
        versions: [">= 1.27"]

  # Base image in the troubleshooting sidecar Dockerfile
  - package-ecosystem: "docker"
    directory: "/ncm-issuer-utils/docker"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    ignore:
      # Stay on RockyLinux 8; skip the major bump to 9
      - dependency-name: "rockylinux"
        update-types: ["version-update:semver-major"]
