name: e2e-nightly
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Every job only reads the repository. The reusable workflows called below inherit this and
# cannot widen it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-versions:
    name: "lookup go versions"
    runs-on: ubuntu-latest
    outputs:
      go-mod-version: ${{ steps.versions.outputs.go-mod-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arnested/go-version-action@83df3d2be676ba748e3c243a7f996e76c28cff23 # v2.1.7
        id: versions
  build-image:
    name: "build ncm-issuer docker image"
    runs-on: ubuntu-latest
    needs: go-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      - run: go version
      - name: "build ncm-issuer image and save to docker image"
        run: |
          for attempt in 1 2 3; do
            echo "docker build attempt $attempt/3"
            make docker-build && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::docker build failed after 3 attempts"
              exit 1
            fi
            echo "docker build failed (likely registry timeout); retrying"
            sleep 20
          done
          docker save ncm-issuer > ncm-issuer-image.tar
          echo "ncm-issuer image built and saved to ncm-issuer-image.tar"
      - name: "Upload ncm-issuer image"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ncm-issuer-image
          path: ncm-issuer-image.tar
          retention-days: 1

  signer:
    name: "signer compatibility matrix"
    needs: [go-versions, build-image]
    uses: ./.github/workflows/signer-tests.yml
    secrets: inherit
    with:
      go-version: ${{ needs.go-versions.outputs.go-mod-version }}
      image-artifact-name: ncm-issuer-image
      full-matrix: true

  clientauth:
    name: "clientauth test"
    needs: [go-versions, build-image]
    uses: ./.github/workflows/clientauth-test.yml
    secrets: inherit
    with:
      go-version: ${{ needs.go-versions.outputs.go-mod-version }}
      image-artifact-name: ncm-issuer-image

  caname-id:
    name: "ca name/id tests"
    needs: [go-versions, build-image]
    uses: ./.github/workflows/caname-id-test.yml
    secrets: inherit
    with:
      go-version: ${{ needs.go-versions.outputs.go-mod-version }}
      image-artifact-name: ncm-issuer-image

  pkey:
    name: "pkey tests"
    needs: [go-versions, build-image]
    uses: ./.github/workflows/pkey-tests.yml
    secrets: inherit
    with:
      go-version: ${{ needs.go-versions.outputs.go-mod-version }}
      image-artifact-name: ncm-issuer-image

  san:
    name: "san test"
    needs: [go-versions, build-image]
    uses: ./.github/workflows/san-test.yml
    secrets: inherit
    with:
      go-version: ${{ needs.go-versions.outputs.go-mod-version }}
      image-artifact-name: ncm-issuer-image
