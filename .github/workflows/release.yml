name: release ncm-issuer
on:
  release:
    types: [published]

# Every job below grants exactly the scopes it needs, so nothing is granted by default.
permissions: {}

jobs:
  docker:
    name: "publish release on GitHub Container Registry"
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://github.com/nokia/ncm-issuer/pkgs/container/ncm-issuer
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "get ncm-issuer image version"
        run: echo TAG=$(grep -m1 imageVersion main.go | cut -d '"' -f2) >> $GITHUB_ENV

      - name: "login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: "set up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "build and publish"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nokia/ncm-issuer:latest,ghcr.io/nokia/ncm-issuer:${{ env.TAG }}

  docker-utils:
    name: "publish troubleshooting sidecar on GitHub Container Registry"
    runs-on: ubuntu-latest
    environment:
      name: ghcr-utils
      url: https://github.com/nokia/ncm-issuer/pkgs/container/ncm-issuer-utils
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "get ncm-issuer image version"
        run: echo TAG=$(grep -m1 imageVersion main.go | cut -d '"' -f2) >> $GITHUB_ENV

      - name: "login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: "set up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "build and publish"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ncm-issuer-utils/docker
          file: ./ncm-issuer-utils/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nokia/ncm-issuer-utils:latest,ghcr.io/nokia/ncm-issuer-utils:${{ env.TAG }}

  package:
    name: "build and attach release tarball"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "resolve tarball name"
        run: |
          APP_VERSION=$(grep -m1 chartVersion main.go | cut -d '"' -f2)
          BUILD_VERSION=$(grep -m1 imageVersion main.go | cut -d '"' -f2)
          echo "ASSET=ncm-issuer-${APP_VERSION}-${BUILD_VERSION}.tar.gz" >> $GITHUB_ENV

      - name: "set up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "build release tarball"
        run: make pack-app

      - name: "upload tarball to release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "${{ env.ASSET }}" --clobber

  package-utils:
    name: "build and attach troubleshooting sidecar image tarball"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "resolve tarball path"
        run: |
          BUILD_VERSION=$(grep -m1 imageVersion main.go | cut -d '"' -f2)
          echo "ASSET=builds/ncm-issuer-utils-images/ncm-issuer-utils-${BUILD_VERSION}.tgz" >> $GITHUB_ENV

      - name: "set up Docker Buildx"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: "build troubleshooting sidecar image tarball"
        run: make docker-save-utils

      - name: "upload tarball to release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "${{ env.ASSET }}" --clobber

  sbom:
    name: "attach an SBOM to the release"
    runs-on: ubuntu-latest
    # The SBOM describes the image that was just published, so it has to run after it exists.
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "get ncm-issuer image version"
        run: echo TAG=$(grep -m1 imageVersion main.go | cut -d '"' -f2) >> $GITHUB_ENV

      - name: "generate the image SBOM"
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/nokia/ncm-issuer:${{ env.TAG }}
          format: spdx-json
          output-file: ncm-issuer-${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: "upload the SBOM to the release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "ncm-issuer-${{ env.TAG }}.spdx.json" --clobber

  pages:
    name: Build mkdocs and helm charts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        # The git-auto-commit step below pushes the release notes using the credentials this
        # checkout leaves in the workspace, so they must stay persisted here.
        persist-credentials: true

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.x

    - name: Install MkDocs and dependencies
      run: |
        pip install mkdocs-material mkdocs-awesome-pages-plugin

    - name: Create release notes file
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_NAME: ${{ github.event.release.name }}
        RELEASE_BODY: ${{ github.event.release.body }}
      run: |
        mkdir -p ./docs/release-notes
        # GitHub release bodies may contain CRLF so strip CR before writing docs
        RELEASE_TAG="${RELEASE_TAG//$'\r'/}"
        RELEASE_NAME="${RELEASE_NAME//$'\r'/}"
        RELEASE_BODY="${RELEASE_BODY//$'\r'/}"
        export RELEASE_NAME
        release_file="./docs/release-notes/${RELEASE_TAG}.md"
        {
          printf -- '---\ntitle: %s\n---\n\n' "$RELEASE_NAME"
          printf '%s\n' "$RELEASE_BODY"
        } | tr -d '\r' > "$release_file"
        awk '{ print } /^nav:$/ { print "    - " ENVIRON["RELEASE_NAME"] ".md" }' docs/release-notes/.pages | tr -d '\r' > docs/release-notes/.pages.tmp
        mv docs/release-notes/.pages.tmp docs/release-notes/.pages

    - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_message: Write release notes to documentation
        file_pattern: './docs/release-notes'
        skip_checkout: true

    - name: Build MkDocs Configuration
      run: |
        mkdocs build

    - name: Package charts
      run: helm package helm/

    - name: Checkout to gh-pages
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: gh-pages
        clean: false
        # The git-auto-commit steps below push the rendered site and the packaged charts using
        # the credentials this checkout leaves in the workspace.
        persist-credentials: true

    - name: Move files to the pages gh-pages
      run: |
        mkdir -p ./docs && rm -rf ./docs/* && mv ./site/* ./docs
        mkdir -p ./charts && mv ./*.tgz ./charts

    - name: Index charts
      run: helm repo index ./charts

    - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_message: Update documentation
        file_pattern: './docs'
        skip_checkout: true

    - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
      with:
        commit_message: Update helm charts
        file_pattern: './charts'
        skip_checkout: true
