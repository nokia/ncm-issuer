name: build
on:
  # Pull requests are the gate for contributed changes, including those from forks. Pushes are
  # limited to the branches that releases are cut from, so a branch with an open pull request is
  # not built twice for the same commit.
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
  workflow_dispatch:

# Jobs that need more than repository read access declare it themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-versions:
    name: "lookup go versions"
    runs-on: ubuntu-latest
    outputs:
      go-mod-version: ${{ steps.versions.outputs.go-mod-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arnested/go-version-action@83df3d2be676ba748e3c243a7f996e76c28cff23 # v2.1.7
        id: versions

  golangci:
    name: "lint"
    needs: go-versions
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "setup go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "verify golangci-lint configuration"
        run: make lint-config

      - name: "run golangci-lint"
        run: make lint

  actionlint:
    name: "lint workflows"
    needs: go-versions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "setup go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "run actionlint"
        run: make lint-actions

      - name: "verify actions are pinned to commit SHAs"
        run: make lint-actions-pinned

  versions:
    name: "check versions, notices and release notes"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # These checks parse the tree with awk and git grep, so this job deliberately sets up no Go
      # toolchain and downloads no modules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "verify the version literals agree"
        run: make check-version

      - name: "verify the third-party notices match go.mod"
        run: make check-notices

      - name: "verify the documentation release notes page is in step"
        run: make check-release-notes

  unit:
    name: "unit tests"
    needs: go-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "setup go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "install dependencies"
        run: go get .

      - name: "test with go"
        run: make test

  build-ncm-issuer:
    name: "build ncm-issuer"
    needs: go-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "setup go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "build ncm-issuer"
        run: make build
