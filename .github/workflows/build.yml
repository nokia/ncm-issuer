name: build
on:
  # Pull requests are the gate for contributed changes, including those from forks. Pushes are
  # limited to the branches that releases are cut from, so a branch with an open pull request is
  # not built twice for the same commit.
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-versions:
    name: "lookup go versions"
    runs-on: ubuntu-latest
    outputs:
      go-mod-version: ${{ steps.versions.outputs.go-mod-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: arnested/go-version-action@v2
        id: versions

  golangci:
    name: "lint"
    needs: go-versions
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "setup go"
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "verify golangci-lint configuration"
        run: make lint-config

      - name: "run golangci-lint"
        run: make lint

  actionlint:
    name: "lint workflows"
    needs: go-versions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "setup go"
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "run actionlint"
        run: make lint-actions

  unit:
    name: "unit tests"
    needs: go-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "setup go"
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "install dependencies"
        run: go get .

      - name: "test with go"
        run: make test

  build-ncm-issuer:
    name: "build ncm-issuer"
    needs: go-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "setup go"
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.go-versions.outputs.go-mod-version }}

      - name: "build ncm-issuer"
        run: make build
