name: Update GitHub Pages Documentation

on:
  workflow_dispatch:

permissions: {}

# Shared with the pages job of publish.yml, so the two never push to gh-pages at the same time.
# Queued runs wait rather than cancel, so a partial commit is never left on the branch.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  pages:
    name: Build mkdocs and helm charts
    runs-on: ubuntu-latest
    # The two git-auto-commit steps below push the rendered site and the packaged charts to
    # the gh-pages branch.
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        # Nothing pushes before the gh-pages checkout below re-authenticates.
        persist-credentials: false

    - name: Install Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.x

    - name: Install MkDocs and dependencies
      run: |
        pip install mkdocs-material mkdocs-awesome-pages-plugin

    - name: Build MkDocs Configuration
      run: |
        mkdocs build

    - name: Package charts
      run: helm package helm/

    - name: Checkout to gh-pages
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: gh-pages
        clean: false
        # The git-auto-commit steps below push the rendered site and the packaged charts using
        # the credentials this checkout leaves in the workspace.
        persist-credentials: true

    - name: Move files to the pages gh-pages
      run: |
        mkdir -p ./docs && rm -rf ./docs/* && mv ./site/* ./docs
        mkdir -p ./charts && mv ./*.tgz ./charts

    - name: Index charts
      run: helm repo index ./charts

    - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: Update documentation
        file_pattern: './docs'
        skip_checkout: true

    - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: Update helm charts
        file_pattern: './charts'
        skip_checkout: true
